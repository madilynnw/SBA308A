<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Top 20 R&B Songs of 2024</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Top 20 R&B Songs of 2024</h1>
      <input type="text" id="search" placeholder="Search for songs..." />
    </header>

    <div class="gallery" id="gallery"></div>

    <!-- Modal for editing song -->
    <div id="editModal" class="modal">
      <div class="modal-content">
        <span id="closeModal" class="close">&times;</span>
        <h2>Edit Song</h2>
        <form id="editForm">
          <input type="text" id="editTitle" placeholder="Song Title" required />
          <input
            type="text"
            id="editArtist"
            placeholder="Artist Name"
            required
          />
          <button type="submit">Save Changes</button>
        </form>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
